setupVersion: 2
memory:
  backend: hindsight
hindsight:
  apiUrl: http://127.0.0.1:9077
  bankId: coding-agent
  scoping: per-project
enabledProviders:
  - claude
modelRoles:
  task: openai-codex/gpt-6-sol:auto
  advisor: anthropic/claude-opus-5-5:auto
  slow: anthropic/claude-opus-5-5:auto
  default: anthropic/claude-opus-5-5
  smol: openai-codex/gpt-6-luna:auto
  judge: openrouter/~typesafe/jev-latest
  web: openai-codex/gpt-5.6-luna:auto
defaultThinkingLevel: auto
contextPromotion:
  enabled: false
compaction:
  enabled: true
  thresholdPercent: 75
  methodOrder:
    - shake
    - remote
    - soft
  thresholdTokens: 300000
dev:
  autoqaConsent: denied
  autoqa: false
hideThinkingBlock: true
composer:
  shape: band
retry:
  waitForUsageReset: true
  usageAwareFallback: true
  fallbackChains:
    judge:
      - openrouter/typesafe/jev-1.13
    default:
      - openai-codex/gpt-6-sol
    slow:
      - openai-codex/gpt-6-astra
    web:
      - openai-codex/gpt-5.6-luna
      - google/gemini-3.8-flash
      - web/public
      - web/exa
      - web/parallel
      - web/perplexity
      - google-antigravity/gemini-3.8-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
    task:
      - anthropic/claude-opus-5-5
advisor:
  enabled: true
  syncBacklog: "1"
prewalk:
  enabled: true
images:
  urls:
    backends:
      - tailscale
      - cloudflared
      - litterbox
    enabled: true
steeringMode: all
followUpMode: all
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: default
tools:
  approvalMode: yolo
error:
  notify: "on"
branchSummary:
  enabled: true
startup:
  checkUpdate: false
edit:
  autoRepair:
    enabled: true
read:
  summarize:
    prose: true
bash:
  allowCompoundCommands: true
python:
  kernelMode: session
astGrep:
  enabled: true
github:
  enabled: true
security:
  enabled: true
todo:
  eager: preferred
task:
  eager: preferred
  enableEffort: true
  maxRecursionDepth: -1
  prewalk: true
  showResolvedModelBadge: true
display:
  cacheMissMarker: true
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: false
ttsr:
  enabled: true
  builtinRules: true
autolearn:
  enabled: true
  autoContinue: true
cycleOrder:
  - smol
  - default
  - slow
  - tiny
codexResets:
  autoRedeem: "yes"
features:
  unexpectedStopDetection: smart
find:
  enabled: auto