setupVersion: 2
memory:
  backend: hindsight
hindsight:
  apiUrl: http://127.0.0.1:9077
  bankId: coding-agent
  scoping: per-project
  requestTimeoutMs: 5000
  recallTimeoutMs: 5000
  mentalModelsEnabled: false
  mentalModelAutoSeed: false
enabledProviders:
  - claude
modelRoles:
  task: anthropic/claude-opus-5:auto
  advisor: anthropic/claude-fable-5-1:auto
  slow: anthropic/claude-fable-5-1:auto
  default: anthropic/claude-fable-5-1
  smol: openai-codex/gpt-5.6-luna:auto
  tiny: openai-codex/gpt-5.6-luna:auto
defaultThinkingLevel: auto
contextPromotion:
  enabled: false
compaction:
  enabled: true
  thresholdPercent: 75
  methodOrder:
    - shake
    - remote
    - soft
  thresholdTokens: 300000
  idleEnabled: true
  experimentalContextManagement: true
  asyncEnabled: false
  remoteStreamingV2Enabled: true
  idleThresholdTokens: 100000
  idleTimeoutSeconds: 3300
dev:
  autoqaConsent: denied
  autoqa: false
hideThinkingBlock: true
composer:
  shape: band
retry:
  waitForUsageReset: true
  usageAwareFallback: true
  fallbackChains:
    judge:
      - openrouter/typesafe/jev-1.13
    default:
      - openai-codex/gpt-6.1-sol
    slow:
      - openai-codex/gpt-6.1-sol
    smol:
      - google-antigravity/gemini-3.8-flash
    task:
      - openai-codex/gpt-5.6-sol
advisor:
  enabled: true
  syncBacklog: "1"
prewalk:
  enabled: true
images:
  urls:
    backends:
      - tailscale
      - cloudflared
      - litterbox
    enabled: true
steeringMode: all
followUpMode: all
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: default
tools:
  approvalMode: yolo
error:
  notify: "on"
branchSummary:
  enabled: true
startup:
  checkUpdate: false
edit:
  autoRepair:
    enabled: true
read:
  summarize:
    prose: true
bash:
  allowCompoundCommands: true
python:
  kernelMode: session
astGrep:
  enabled: true
github:
  enabled: true
security:
  enabled: true
todo:
  eager: preferred
task:
  eager: preferred
  enableEffort: true
  maxRecursionDepth: -1
  prewalk: true
  showResolvedModelBadge: true
  maxEffort: high
display:
  cacheMissMarker: true
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: false
ttsr:
  enabled: true
  builtinRules: true
autolearn:
  enabled: true
  autoContinue: true
cycleOrder:
  - default
  - task
  - smol
  - tiny
codexResets:
  autoRedeem: "no"
features:
  unexpectedStopDetection: smart
find:
  enabled: auto
