[tools]
gitleaks = "8"
"pipx:pytest" = "8"
python = "3.14"
"github:microsoft/apm" = "0.30.0"

[tasks.agent-sync]
description = "Converge project-owned coding agent configuration."
usage = '''
flag "--refresh" help="Resolve available dependency releases before convergence"
flag "--frozen" help="Verify the committed lock and generated coding agent state"
'''
run = """
if [ "${usage_refresh:-false}" = true ] && [ "${usage_frozen:-false}" = true ]; then
  echo "error: --refresh and --frozen cannot be combined" >&2
  exit 2
fi
mode=default
if [ "${usage_refresh:-false}" = true ]; then mode=refresh; fi
if [ "${usage_frozen:-false}" = true ]; then mode=frozen; fi
command -v apm >/dev/null || { echo "error: apm 0.30.0 is required; run 'mise install'" >&2; exit 127; }
command -v python3 >/dev/null || { echo "error: python3 is required; run 'mise install'" >&2; exit 127; }
agent_targets="$(python3 -c '
import re
from pathlib import Path

targets = []
in_targets = False
for line in Path("apm.yml").read_text().splitlines():
    if not in_targets:
        in_targets = re.fullmatch(r"targets:\\s*(?:#.*)?", line) is not None
        continue
    stripped = line.strip()
    if not stripped or stripped.startswith("#"):
        continue
    match = re.fullmatch(r"-\\s*([a-z0-9-]+)(?:\\s+#.*)?", stripped)
    if match is None:
        break
    targets.append(match.group(1))
print(",".join(targets))
')"
if [ -z "$agent_targets" ]; then
  echo "error: apm.yml must activate at least one coding agent target" >&2
  exit 2
fi
if [ "$mode" = frozen ]; then
  # Add every implemented coding agent's generated paths to both frozen checks.
  frozen_changes="$(git status --porcelain=v1 --untracked-files=all -- \
    apm.yml apm.lock.yaml .apm AGENTS.md CLAUDE.md \
    ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' \
    .agents .claude .codex .github/instructions)"
  if [ -n "$frozen_changes" ]; then
    echo "error: frozen agent configuration changed:" >&2
    echo "$frozen_changes" >&2
    echo "run 'mise run agent-sync' and commit the resulting agent configuration" >&2
    exit 1
  fi
fi
case "$mode" in
  default) apm install --target "$agent_targets" ;;
  refresh) apm update --yes --target "$agent_targets" ;;
  frozen)
    apm install --frozen --target "$agent_targets"
    apm audit --ci --no-policy
    ;;
esac
apm compile --clean
apm compile --validate
apm audit --ci --no-policy
# Add native-output validation for every implemented coding agent here.
if [ -f .mcp.json ]; then python3 -m json.tool .mcp.json >/dev/null; fi
if [ -f .codex/config.toml ]; then python3 -c 'import tomllib; tomllib.load(open(".codex/config.toml", "rb"))'; fi
if [ "$mode" = frozen ]; then
  # Add every implemented coding agent's generated paths to both frozen checks.
  frozen_changes="$(git status --porcelain=v1 --untracked-files=all -- \
    apm.yml apm.lock.yaml .apm AGENTS.md CLAUDE.md \
    ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' \
    .agents .claude .codex .github/instructions)"
  if [ -n "$frozen_changes" ]; then
    echo "error: frozen agent configuration changed:" >&2
    echo "$frozen_changes" >&2
    echo "run 'mise run agent-sync' and commit the resulting agent configuration" >&2
    exit 1
  fi
fi
"""

[tasks.test]
alias = "test:changed"
description = "Run the project test suite; it is fast enough to be the loop's test:changed too."
run = "pytest -q"

[tasks."setup:dev"]
description = "Set up a fresh checkout or worktree: install the gitignored agent skills the loop's tasks call."
run = "mise run agent-sync"

[tasks.check]
description = "The test suite and the frozen agent configuration check. The loop runs it before every push, and CI runs it as the merge proof."
run = ["mise run test", "mise run agent-sync --frozen"]

[tasks."loop:approvals"]
description = "Checks the loop's proofs on GitHub: approved spec, verdict, Evidence, local check. merge exits 3 while it waits."
usage = '''
arg "<point>" help="build or merge"
arg "[pr]" help="the PR number; default: this branch's PR"
'''
run = [
  'test -f .agents/skills/engineering-loop/scripts/approvals.py || { echo "loop:approvals: the engineering-loop skill is not installed; run mise run agent-sync" >&2; exit 1; }',
  'uv run .agents/skills/engineering-loop/scripts/approvals.py check "${usage_point}" ${usage_pr:-}',
]

[tasks."loop:land"]
description = "The one way an agent lands a PR: every merge proof, then ready and a squash merge pinned to the head. Exits 0 merged, 1 on a missing proof, 3 while it waits."
usage = '''
arg "<pr>" help="the PR number"
flag "--wait" help="wait until the PR merges or needs someone"
'''
run = [
  'test -f .agents/skills/engineering-loop/scripts/approvals.py || { echo "loop:land: the engineering-loop skill is not installed; run mise run agent-sync" >&2; exit 1; }',
  'uv run .agents/skills/engineering-loop/scripts/approvals.py land "${usage_pr}" $([ "${usage_wait:-false}" = true ] && echo --wait)',
]
